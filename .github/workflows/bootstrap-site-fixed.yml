name: Bootstrap site fixed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".payload2/**"
      - ".github/workflows/bootstrap-site-fixed.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild site archive
        shell: bash
        run: |
          set -euo pipefail
          cat .payload2/chunk-* | tr -d '\r\n\t ' > /tmp/site.zip.b64
          base64 --decode /tmp/site.zip.b64 > /tmp/site.zip
          unzip -t /tmp/site.zip
          mkdir -p /tmp/site
          unzip -oq /tmp/site.zip -d /tmp/site
          cp -a /tmp/site/. .
          rm -rf .payload2 .bootstrap
          rm -f .github/workflows/bootstrap-site.yml
          rm -f .github/workflows/bootstrap-site-fixed.yml
      - name: Commit complete site
        shell: bash
        run: |
          git config user.name "kino-finance-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish cinema financing site"
          git push
