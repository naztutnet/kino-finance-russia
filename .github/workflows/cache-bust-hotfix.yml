name: Cache-bust UI hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = '202608061200'
          for name in ('index.html', 'istochniki.html', 'calendar.html'):
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for asset in ('style.css', 'horizontal.css', 'mvp.css', 'card-tools-fix.css', 'enhancements.js', 'mvp.js', 'card-tools-fix.js'):
                  pattern = rf'({re.escape(asset)})(?:\?v=[0-9]+)?'
                  text = re.sub(pattern, rf'\1?v={version}', text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cache-bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html istochniki.html calendar.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix: force browsers to load UI freeze hotfix'
            git push
          fi
