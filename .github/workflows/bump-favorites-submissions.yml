name: Publish favorites and submissions separation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-favorites-submissions.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh UI script version
        shell: bash
        run: |
          sed -i 's/card-tools-fix.js?v=202608061320/card-tools-fix.js?v=202608061412/g' index.html istochniki.html calendar.html || true

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html istochniki.html calendar.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh favorites and submissions UI'
            git push
          fi
