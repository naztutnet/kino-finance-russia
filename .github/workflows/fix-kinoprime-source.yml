name: Fix Kinoprime requirements source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-kinoprime-source.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace URL
        run: |
          sed -i "s#kinoprime: 'https://www.kinoprimefoundation.com/'#kinoprime: 'https://www.kinoprimefoundation.com/#rec98743691'#" requirements.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: set exact Kinoprime requirements anchor'
            git push
          fi
