name: Bootstrap and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kino-finance-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct uploaded site archive
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.bootstrap/chunk-*' > /dev/null; then
            echo 'Bootstrap chunks found. Reconstructing site archive.'
            cat $(find .bootstrap -maxdepth 1 -type f -name 'chunk-*' | sort) | tr -d '\r\n' | base64 --decode > /tmp/kino-site.zip
            unzip -t /tmp/kino-site.zip
            rm -rf /tmp/kino-site
            mkdir -p /tmp/kino-site
            unzip -q /tmp/kino-site.zip -d /tmp/kino-site

            shopt -s dotglob nullglob
            entries=(/tmp/kino-site/*)
            source_root=/tmp/kino-site
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              source_root="${entries[0]}"
            fi

            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .bootstrap -exec rm -rf {} +
            cp -a "$source_root"/. ./
            rm -rf .bootstrap
            touch .nojekyll
            echo 'installed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No bootstrap chunks. Deploying current repository.'
            touch .nojekyll
            echo 'installed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit reconstructed files
        if: steps.bootstrap.outputs.installed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish cinema financing site'
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
