name: Refresh disabled export controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-disabled-export-controls.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump disabled controls asset
        shell: bash
        run: |
          sed -i 's/disable-pdf.js?v=202608061326/disable-pdf.js?v=202608061330/g' index.html || true

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh disabled export controls'
            git push
          fi
