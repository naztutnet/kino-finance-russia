name: Install disabled PDF control

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-disable-pdf.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace PDF scripts with disabled control
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('index.html','istochniki.html','calendar.html'):
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              lines=[]
              for line in s.splitlines():
                  if any(x in line for x in ('pdf-export.js','pdf-export-fix.js','pdf-export-v3.js')):
                      continue
                  lines.append(line)
              s='\n'.join(lines)+'\n'
              tag='<script src="disable-pdf.js?v=202608061326" defer></script>'
              if tag not in s:
                  s=s.replace('</head>',f'{tag}\n</head>')
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html istochniki.html calendar.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix: disable PDF export in published pages'
            git push
          fi
