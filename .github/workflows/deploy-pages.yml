name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore intended website package
        shell: bash
        run: |
          if [ ! -f .github/workflows/apply-redesign.yml ]; then
            echo 'Embedded redesign package is already applied'
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import base64
          import re
          import zipfile

          workflow = Path('.github/workflows/apply-redesign.yml')
          text = workflow.read_text(encoding='utf-8')
          match = re.search(r"cat > /tmp/site\.zip\.b64 <<'EOF'\n(.*?)\nEOF", text, re.S)
          if not match:
              raise SystemExit('Embedded website archive was not found')

          archive = Path('/tmp/site.zip')
          archive.write_bytes(base64.b64decode(match.group(1)))
          with zipfile.ZipFile(archive) as package:
              package.extractall('.')
          PY

          rm -f .github/workflows/apply-redesign.yml
          rm -f .github/workflows/run-redesign.yml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save restored website to repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Repository already contains the intended website'
            exit 0
          fi
          git commit -m 'fix: publish intended financing assistant website'
          git push
