name: Publish disabled PDF export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disable-pdf-export.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh UI asset version
        shell: bash
        run: |
          sed -i 's/card-tools-fix.js?v=202608061305/card-tools-fix.js?v=202608061320/g' index.html || true
          sed -i 's/card-tools-fix.js?v=202608061248/card-tools-fix.js?v=202608061320/g' istochniki.html calendar.html || true

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html istochniki.html calendar.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh disabled PDF export UI'
            git push
          fi
