name: Refresh PDF fix assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-pdf-fix.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump asset version
        run: |
          sed -i 's/card-tools-fix.js?v=202608061239/card-tools-fix.js?v=202608061305/g' index.html istochniki.html calendar.html || true
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html istochniki.html calendar.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh PDF fix assets'
            git push
          fi
