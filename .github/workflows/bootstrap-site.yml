name: Bootstrap site

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild site archive
        shell: bash
        run: |
          cat .bootstrap/chunk-* > /tmp/site.zip.b64
          base64 --decode /tmp/site.zip.b64 > /tmp/site.zip
          mkdir -p /tmp/site
          unzip -oq /tmp/site.zip -d /tmp/site
          cp -a /tmp/site/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-site.yml

      - name: Commit complete site
        shell: bash
        run: |
          git config user.name "kino-finance-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: publish cinema financing site"
          git push
