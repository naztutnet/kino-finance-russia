name: Apply intended redesign

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-redesign.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore intended site files
        shell: bash
        run: |
          cat > /tmp/site.zip.b64 <<'EOF'
[...]
EOF
          base64 -d /tmp/site.zip.b64 > /tmp/site.zip
          unzip -o /tmp/site.zip -d .
          rm -f .github/workflows/apply-redesign.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html istochniki.html style.css data.json README.md .github/workflows/apply-redesign.yml
          git commit -m 'fix: restore intended financing assistant design'
          git push
