name: Check financing sources

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data-*.json'
      - 'result-links.json'
      - 'scripts/rebuild_deadlines.py'
      - 'scripts/update_calendar.py'

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild full deadlines catalog
        run: python scripts/rebuild_deadlines.py

      - name: Check official sources and rebuild ICS
        run: python scripts/update_calendar.py

      - name: Detect changes requiring review
        id: review
        shell: bash
        run: |
          if git diff --quiet -- needs_review.json changes_summary.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create review issue
        if: steps.review.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Изменились официальные источники финансирования — $(date -u +%Y-%m-%d)"
          gh issue create --title "$title" --body-file changes_summary.md

      - name: Commit generated updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deadlines.json source_status.json needs_review.json changes_summary.md kino-finance-deadlines.ics 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh complete financing calendar'
            git push
          fi
